<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b19">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha · Karaoke Show</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#31315c 0,#090b19 58%);color:#f8f8ff;padding:18px}
    main{width:100%;max-width:470px;background:#15182b;border:1px solid #363952;border-radius:22px;padding:clamp(22px,6vw,36px);box-shadow:0 25px 75px #0008}
    .icon{font-size:42px;margin:0 0 6px} h1{font-size:25px;margin:4px 0 8px}
    p{line-height:1.6;color:#c3c5d6;font-size:14px;margin:10px 0}
    label{display:block;font-weight:650;font-size:14px;margin:18px 0}
    input{width:100%;background:#0c0e1c;color:white;border:1px solid #575b76;border-radius:11px;padding:13px 14px;font:inherit;margin-top:8px}
    input:focus{outline:2px solid #a588ff;outline-offset:2px}
    button{width:100%;border:0;border-radius:11px;background:#8458f7;color:#fff;padding:13px;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.6;cursor:progress}
    a{color:#c5b0ff}
    .message{white-space:pre-line;background:#24273e;border-radius:10px;padding:12px;margin:18px 0;color:#e7e7ff}
    .message.error{background:#43232d;color:#ffe2e7}
    .actions{margin-top:20px;text-align:center}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🎤</div>
  <h1>Redefinir senha</h1>
  <p>Área administrativa do Karaoke Show. Seus dados são processados pelo Supabase Auth.</p>
  <p id="message" class="message" role="status" aria-live="polite">Verificando o link de recuperação…</p>
  <form id="new-password" hidden>
    <label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required></label>
    <label>Confirme a nova senha<input name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="72" required></label>
    <button type="submit">Salvar nova senha</button>
  </form>
  <form id="request-reset" hidden>
    <label>E-mail cadastrado<input name="email" type="email" autocomplete="email" required></label>
    <button type="submit">Enviar novo link de recuperação</button>
  </form>
  <div class="actions"><a href="./">Voltar ao Karaoke Show</a></div>
</main>
<script type="module" src="./src/password-reset.js"></script>
</body>
</html>
