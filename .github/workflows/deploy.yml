name: Publicar Karaoke Show no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "redefinir-senha.html"
      - "styles.css"
      - "sw.js"
      - "manifest.webmanifest"
      - "src/**"
      - "assets/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test && npm run check && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      # O upload pode ficar visível no artefato antes da indexação da API do GitHub Pages.
      # Dar um pequeno intervalo evita falsos 404 "No artifacts named github-pages".
      - name: Aguardar indexação do artefato Pages
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
