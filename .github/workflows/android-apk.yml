name: Gerar APK de teste (Android e TV Box)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'package.json'
      - 'tools/**'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar o Karaoke Show
        run: npm test && npm run check && npm run build
      - name: Copiar site para o APK offline
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Salvar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-show-tvbox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
